# Tiny Maggiar-style lost-sales config for local smoke tests.
# This is intentionally small and is not a scientific experiment setting.

history_length_H: 8
training_horizon_T: 8
evaluation_horizon: 12
burn_in: 2
training_products: 8
test_products: 6
batch_size: 4
epochs: 2
optimizer: Adam
learning_rate: 0.001

fcnn:
  history_encoder: causal_cnn
  hidden_layers: 1
  hidden_units: 8
  cnn_channels: 4
  cnn_dilations: [1, 2]
  activation: ELU
  imitation_epochs: 1
  validation_interval: 1
  use_full_history: true
  scale_action_by_history_mean: true
  max_order_factor: 4.0

demand_distribution: Gamma

product_features:
  - price
  - purchase_cost
  - holding_cost
  - lost_sale_penalty
  - mean_demand
  - coefficient_of_variation

product_generation:
  seed: 2025
  mode: paper_table_1
  price_mean: 20.0
  holding_cost_mean: 1.0
  mean_demand_mean: 10.0
  lost_sale_penalty_max: 3.0
  coefficient_of_variation_range: [0.0, 1.0]

tuning:
  min_stock_level: 0
  max_stock_level: 60
  oracle_mc_samples: 2000

runtime:
  max_training_products: 8
  max_test_products: 6
  baseline_eval_products: 6
  fcnn_train_products: 8
  fcnn_test_products: 6
  fcnn_validation_products: 2
  fcnn_train_epochs: 2
