# Colab-scale Maggiar-style lost-sales config.
# Use for validation-based model development on Google Colab or another larger runtime.
# The test split is still guarded and should be used only for final evaluation.

history_length_H: 32
training_horizon_T: 100
evaluation_horizon: 520
burn_in: 20
training_products: 40000
test_products: 100000
batch_size: 1024
epochs: 500
optimizer: Adam
learning_rate: 0.001

fcnn:
  history_encoder: causal_cnn
  hidden_layers: 2
  hidden_units: 32
  cnn_channels: 8
  cnn_dilations: [1, 2, 4, 8, 16]
  activation: ELU
  imitation_epochs: 40
  validation_interval: 10
  use_full_history: true
  scale_action_by_history_mean: true
  max_order_factor: 4.0

monokan:
  hidden_layers: 1
  hidden_units: 8
  grid: 3
  grid_range: [-2.0, 4.0]
  monotonic_inventory: nonincreasing
  scale_action_by_history_mean: true
  max_order_factor: 2.0
  learning_rate: 0.0005
  imitation_epochs: 80
  validation_interval: 10
  TODO: "Increase hidden_units/grid only after validation confirms the small MonoKAN remains stable."

demand_distribution: Gamma

product_features:
  - price
  - purchase_cost
  - holding_cost
  - lost_sale_penalty
  - mean_demand
  - coefficient_of_variation

product_generation:
  seed: 2025
  mode: paper_table_1
  price_mean: 100.0
  holding_cost_mean: 5.0
  mean_demand_mean: 100.0
  lost_sale_penalty_max: 10.0
  coefficient_of_variation_range: [0.0, 1.0]

tuning:
  min_stock_level: 0
  max_stock_level: 120
  oracle_mc_samples: 200000

runtime:
  baseline_eval_products: 500
  fcnn_train_products: 5000
  fcnn_test_products: 1000
  fcnn_validation_products: 500
  fcnn_train_epochs: 250
  monokan_train_products: 3000
  monokan_train_epochs: 250
  monokan_sweep_train_products: 1000
  monokan_sweep_batch_size: 512
  monokan_sweep_horizon: 100
  monokan_sweep_epochs: 50
