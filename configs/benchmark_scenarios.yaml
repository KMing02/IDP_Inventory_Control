horizon: 40
n_episodes: 50
seed: 123
initial_inventory: 10

tuning:
  min_stock_level: 0
  max_stock_level: 30

demand_processes:
  poisson_medium:
    type: poisson
    lam: 8.0
  negative_binomial:
    type: negative_binomial
    mean: 8.0
    dispersion: 2.5
  seasonal_poisson:
    type: seasonal_poisson
    base_lambda: 8.0
    amplitude: 4.0
    period: 12

cost_regimes:
  balanced:
    holding_cost: 1.0
    lost_sales_cost: 5.0
    unit_order_cost: 1.0
    fixed_order_cost: 0.0
    regular_unit_order_cost: 1.0
    expedited_unit_order_cost: 2.5
    regular_fixed_order_cost: 0.0
    expedited_fixed_order_cost: 0.0
  high_lost_sales:
    holding_cost: 1.0
    lost_sales_cost: 12.0
    unit_order_cost: 1.0
    fixed_order_cost: 0.0
    regular_unit_order_cost: 1.0
    expedited_unit_order_cost: 2.5
    regular_fixed_order_cost: 0.0
    expedited_fixed_order_cost: 0.0
  high_holding:
    holding_cost: 4.0
    lost_sales_cost: 5.0
    unit_order_cost: 1.0
    fixed_order_cost: 0.0
    regular_unit_order_cost: 1.0
    expedited_unit_order_cost: 2.5
    regular_fixed_order_cost: 0.0
    expedited_fixed_order_cost: 0.0

scenarios:
  - name: lost_sales_zero_lead_time
    environment_type: lost_sales_zero_lead_time
    demand: poisson_medium
    cost: balanced

  - name: lost_sales_lead_time_L2
    environment_type: lost_sales_lead_time
    lead_time: 2
    demand: poisson_medium
    cost: balanced

  - name: lost_sales_lead_time_high_variance
    environment_type: lost_sales_lead_time
    lead_time: 2
    demand: negative_binomial
    cost: balanced

  - name: lost_sales_lead_time_seasonal
    environment_type: lost_sales_lead_time
    lead_time: 2
    demand: seasonal_poisson
    cost: balanced

  - name: lost_sales_high_stockout_cost
    environment_type: lost_sales_lead_time
    lead_time: 2
    demand: poisson_medium
    cost: high_lost_sales

  - name: lost_sales_high_holding_cost
    environment_type: lost_sales_lead_time
    lead_time: 2
    demand: poisson_medium
    cost: high_holding

  - name: dual_sourcing_basic
    environment_type: dual_sourcing
    regular_lead_time: 2
    expedited_lead_time: 1
    demand: poisson_medium
    cost: balanced
    heuristic:
      S_regular: 16
      S_expedited: 5

  - name: dual_sourcing_high_variance
    environment_type: dual_sourcing
    regular_lead_time: 2
    expedited_lead_time: 1
    demand: negative_binomial
    cost: balanced
    heuristic:
      S_regular: 18
      S_expedited: 6
