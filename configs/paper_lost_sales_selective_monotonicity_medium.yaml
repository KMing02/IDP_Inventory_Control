# Predeclared medium identification profile for all-lag versus selective monotonicity.
# This is development evidence, not paper replication or protected final evaluation.

history_length_H: 32
paper_history_feature_mode: raw_lags
paper_include_newsvendor_feature: false
training_horizon_T: 100
evaluation_horizon: 520
burn_in: 20
training_products: 1000
test_products: 300
batch_size: 512
epochs: 500
optimizer: Adam
learning_rate: 0.001
include_terminal_salvage: true

fcnn:
  hidden_layers: 2
  hidden_units: 32
  activation: ELU
  max_order_factor: 4.0

monokan:
  hidden_layers: 1
  hidden_units: 4
  grid: 3
  grid_range: [-2.0, 4.0]
  noise_scale: 0.01
  scale_action_by_history_mean: true
  max_order_factor: 4.0

idp_benchmark:
  seed: 2025
  max_order_factor: 4.0
  normalize_reward_loss: false
  include_terminal_salvage: true
  training_demand_mode: fixed_future
  initial_inventory_mode: last_historical_demand
  compact:
    training_products: 1000
    validation_products: 300
    batch_size: 512
    training_horizon: 100
    imitation_epochs: 0
    reward_epochs: 500
    validation_interval: 25
    evaluation_horizon: 520
    burn_in: 20

demand_distribution: Gamma

product_features:
  - price
  - purchase_cost
  - holding_cost
  - lost_sale_penalty
  - mean_demand
  - coefficient_of_variation

product_generation:
  seed: 2025
  mode: paper_table_1
  price_mean: 100.0
  holding_cost_mean: 5.0
  mean_demand_mean: 100.0
  lost_sale_penalty_max: 10.0
  coefficient_of_variation_range: [0.0, 1.0]

tuning:
  min_stock_level: 0
  max_stock_level: 120
  oracle_mc_samples: 200000
