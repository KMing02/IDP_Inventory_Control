# Small local factorial architecture diagnostic.
# This is larger than the debug smoke config but still not a paper-level run.

history_length_H: 16
training_horizon_T: 40
evaluation_horizon: 120
burn_in: 20
training_products: 1024
test_products: 200
batch_size: 64
epochs: 120
optimizer: Adam
learning_rate: 0.0005
include_terminal_salvage: false

fcnn:
  history_encoder: causal_cnn
  hidden_layers: 2
  hidden_units: 32
  cnn_channels: 8
  cnn_dilations: [1, 2, 4, 8]
  activation: ELU
  imitation_epochs: 0
  validation_interval: 20
  use_full_history: true
  scale_action_by_history_mean: true
  max_order_factor: 4.0
  residual_scale: 0.5
  residual_anchor: gamma

monokan:
  hidden_layers: 1
  hidden_units: 4
  grid: 3
  grid_range: [-2.0, 4.0]
  noise_scale: 0.01
  bounded_spline_scale_init: 1.0
  bounded_spline_slope_init: 1.0
  monotonic_inventory: nonincreasing
  scale_action_by_history_mean: true
  max_order_factor: 4.0
  residual_scale: 0.05
  residual_anchor: gamma

positive_weight_mlp:
  hidden_layers: 2
  hidden_units: 32
  activation: ELU
  monotonic_feature: 0
  monotonic_direction: -1

constrained_monotone_mlp:
  hidden_layers: 2
  hidden_units: 32
  activation: ELU
  mixed_activation: true
  monotonic_feature: 0
  monotonic_direction: -1

idp_benchmark:
  seed: 2025
  hidden_layers: 2
  hidden_units: 32
  activation: ELU
  max_order_factor: 4.0
  scale_action_by_history_mean: true
  normalize_reward_loss: true
  include_terminal_salvage: false
  training_demand_mode: fixed_future
  residual_anchor: gamma
  spline_l2_weight: 0.0
  scale_l2_weight: 0.0
  monotonicity_samples_per_product: 1
  penalty_weights: [10.0]
  raw_violation_threshold: 0.01
  acceptance_reward_gap_tolerance_pct: 0.5
  compact:
    training_products: 1024
    validation_products: 100
    batch_size: 64
    learning_rate: 0.0005
    training_horizon: 40
    imitation_epochs: 0
    reward_epochs: 120
    validation_interval: 20
    spline_l2_weight: 0.0
    scale_l2_weight: 0.0
    evaluation_horizon: 120
    burn_in: 20
    inventory_states: 31
    structure_products: 3
    order_up_to_products: 100
    oracle_mc_samples: 50000
    penalty_weights: [10.0]
  full:
    training_products: 2048
    validation_products: 200
    batch_size: 64
    learning_rate: 0.0005
    training_horizon: 60
    imitation_epochs: 0
    reward_epochs: 200
    validation_interval: 25
    evaluation_horizon: 220
    burn_in: 20
    inventory_states: 41
    structure_products: 3
    order_up_to_products: 200
    oracle_mc_samples: 100000
  paper_replication:
    training_products: 40000
    validation_products: 100000
    batch_size: 2500
    training_horizon: 100
    imitation_epochs: 20
    reward_epochs: 1000
    validation_interval: 10
    evaluation_horizon: 520
    burn_in: 20
    inventory_states: 100
    structure_products: 3
    order_up_to_products: 1000
    oracle_mc_samples: 200000
  sample_efficiency:
    history_windows: [16, 32]
    training_products_grid: [256, 1024]

demand_distribution: Gamma

product_features:
  - price
  - purchase_cost
  - holding_cost
  - lost_sale_penalty
  - mean_demand
  - coefficient_of_variation

product_generation:
  seed: 2025
  mode: paper_table_1
  price_mean: 100.0
  holding_cost_mean: 5.0
  mean_demand_mean: 100.0
  lost_sale_penalty_max: 10.0
  coefficient_of_variation_range: [0.0, 1.0]

tuning:
  min_stock_level: 0
  max_stock_level: 120
  oracle_mc_samples: 50000

runtime:
  max_training_products: 1024
  max_test_products: 200
  baseline_eval_products: 100
  fcnn_train_products: 1024
  fcnn_test_products: 100
  fcnn_validation_products: 100
  fcnn_train_epochs: 120
  monokan_sweep_train_products: 256
  monokan_sweep_selection_products: 50
  monokan_sweep_batch_size: 64
  monokan_sweep_horizon: 40
  monokan_sweep_epochs: 40
