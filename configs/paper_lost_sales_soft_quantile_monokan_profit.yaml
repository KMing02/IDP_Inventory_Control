# Profit-oriented sibling of paper_lost_sales_soft_quantile_monokan.yaml.
#
# Identical policy; the only change is that the objective is the unweighted
# reward sum. That maximises total profit (4,286.5 vs 4,285.3) at the cost of
# per-product regret (1.77% vs 1.04%), because the gradient is then dominated
# by the largest price-times-demand products. Use this config when the reported
# metric is total profit; use the weighted config when typical-SKU performance
# matters. 1,200 epochs suffices here -- reward is flat from 1,200 to 2,400.

history_length_H: 32
paper_history_feature_mode: raw_lags
paper_include_newsvendor_feature: false
training_horizon_T: 100
evaluation_horizon: 520
burn_in: 20
training_products: 1000
test_products: 300
batch_size: 512
epochs: 1200
optimizer: Adam
learning_rate: 0.001
include_terminal_salvage: true
fcnn:
  history_encoder: causal_cnn
  hidden_layers: 2
  hidden_units: 32
  cnn_channels: 8
  cnn_dilations:
  - 1
  - 2
  - 4
  - 8
  - 16
  activation: ELU
  roll_history: true
  scale_action_by_history_mean: true
  max_order_factor: 4.0
monokan:
  level_network: monokan
  level_hidden_layers: 2
  level_hidden_units: 8
  grid: 7
  grid_range:
  - -2.0
  - 4.0
  noise_scale: 0.01
  adaptive_grid: true
  adaptive_grid_eps: 0.1
  window_mode: expanding
  temperature_mode: count
  initial_temperature: 2.0
  initial_quantile_level: 0.85
  gain_mode: level
  roll_history: true
  scale_action_by_history_mean: true
  max_order_factor: 4.0
idp_benchmark:
  seed: 2025
  max_order_factor: 4.0
  normalize_observations: true
  normalize_reward_loss: false
  per_product_reward_weighting: false
  include_terminal_salvage: true
  training_demand_mode: fixed_future
  initial_inventory_mode: last_historical_demand
  enforce_action_cap: false
  compact:
    training_products: 1000
    validation_products: 300
    batch_size: 512
    training_horizon: 100
    imitation_epochs: 0
    reward_epochs: 1200
    validation_interval: 75
    evaluation_horizon: 520
    burn_in: 20
demand_distribution: Gamma
product_features:
- price
- purchase_cost
- holding_cost
- lost_sale_penalty
- mean_demand
- coefficient_of_variation
product_generation:
  seed: 2025
  mode: paper_table_1
  price_mean: 100.0
  holding_cost_mean: 5.0
  mean_demand_mean: 100.0
  lost_sale_penalty_max: 10.0
  coefficient_of_variation_range:
  - 0.0
  - 1.0
tuning:
  min_stock_level: 0
  max_stock_level: 120
  oracle_mc_samples: 200000
