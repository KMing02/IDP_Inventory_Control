# Medium-scale single-seed validation after the faithful CMNN correction.
# This configuration uses only the validation split and fixes all experiment
# randomness at base seed 0. It is diagnostic, not a hyperparameter sweep.

history_length_H: 32
training_horizon_T: 50
evaluation_horizon: 120
burn_in: 20
training_products: 128
test_products: 32
batch_size: 64
epochs: 15
optimizer: Adam
learning_rate: 0.001

fcnn:
  history_encoder: causal_cnn
  hidden_layers: 2
  hidden_units: 32
  cnn_channels: 8
  cnn_dilations: [1, 2, 4, 8, 16]
  activation: ELU
  imitation_epochs: 5
  validation_interval: 5
  use_full_history: true
  scale_action_by_history_mean: true
  max_order_factor: 4.0

monokan:
  hidden_layers: 1
  hidden_units: 8
  grid: 3
  grid_range: [-2.0, 4.0]
  monotonic_inventory: nonincreasing
  scale_action_by_history_mean: true
  max_order_factor: 4.0

positive_weight_mlp:
  hidden_layers: 2
  hidden_units: 32
  activation: ELU
  monotonic_feature: 0
  monotonic_direction: -1

constrained_monotone_mlp:
  hidden_layers: 2
  hidden_units: 32
  activation: ELU
  mixed_activation: true
  activation_weights: [1.0, 1.0, 1.0]
  monotonic_feature: 0
  monotonic_direction: -1

idp_benchmark:
  seed: 0
  hidden_layers: 2
  hidden_units: 32
  activation: ELU
  max_order_factor: 4.0
  scale_action_by_history_mean: true
  normalize_reward_loss: true
  imitation_early_stopping: false
  imitation_max_epochs: null
  imitation_patience: 10
  imitation_min_delta: 0.0
  reset_optimizer_after_imitation: false
  monotonicity_samples_per_product: 2
  penalty_weights: [10.0]
  raw_violation_threshold: 0.01
  acceptance_reward_gap_tolerance_pct: 0.5
  full:
    training_products: 128
    validation_products: 32
    batch_size: 64
    training_horizon: 50
    imitation_epochs: 5
    reward_epochs: 15
    validation_interval: 5
    evaluation_horizon: 120
    burn_in: 20
    inventory_states: 50
    structure_products: 3
    order_up_to_products: 32
    oracle_mc_samples: 5000

demand_distribution: Gamma

product_features:
  - price
  - purchase_cost
  - holding_cost
  - lost_sale_penalty
  - mean_demand
  - coefficient_of_variation

product_generation:
  seed: 0
  mode: paper_table_1
  price_mean: 100.0
  holding_cost_mean: 5.0
  mean_demand_mean: 100.0
  lost_sale_penalty_max: 10.0
  coefficient_of_variation_range: [0.0, 1.0]

tuning:
  min_stock_level: 0
  max_stock_level: 120
  oracle_mc_samples: 5000
