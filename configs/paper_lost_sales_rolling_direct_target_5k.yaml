# Matched development comparison against the paper-style raw-action FCNN.
# Direct-target policies recompute S_t from the causal rolling history each period.

history_length_H: 32
paper_history_feature_mode: raw_lags
paper_include_newsvendor_feature: false
training_horizon_T: 100
evaluation_horizon: 520
burn_in: 20
training_products: 5000
test_products: 500
batch_size: 2500
epochs: 1000
optimizer: Adam
learning_rate: 0.001
include_terminal_salvage: true

fcnn:
  history_encoder: causal_cnn
  hidden_layers: 2
  hidden_units: 32
  cnn_channels: 8
  cnn_dilations: [1, 2, 4, 8, 16]
  activation: ELU
  roll_history: true
  scale_action_by_history_mean: true
  max_order_factor: 4.0

monokan:
  hidden_layers: 1
  hidden_units: 4
  grid: 3
  grid_range: [-2.0, 4.0]
  noise_scale: 0.01
  roll_history: true
  scale_action_by_history_mean: true
  max_order_factor: 4.0

idp_benchmark:
  seed: 2025
  max_order_factor: 4.0
  normalize_observations: false
  normalize_reward_loss: false
  include_terminal_salvage: true
  training_demand_mode: fixed_future
  initial_inventory_mode: last_historical_demand
  enforce_action_cap: false
  compact:
    training_products: 5000
    validation_products: 500
    batch_size: 2500
    training_horizon: 100
    imitation_epochs: 0
    reward_epochs: 1000
    validation_interval: 1000
    evaluation_horizon: 520
    burn_in: 20

demand_distribution: Gamma

product_features:
  - price
  - purchase_cost
  - holding_cost
  - lost_sale_penalty
  - mean_demand
  - coefficient_of_variation

product_generation:
  seed: 2025
  mode: paper_table_1
  price_mean: 100.0
  holding_cost_mean: 5.0
  mean_demand_mean: 100.0
  lost_sale_penalty_max: 10.0
  coefficient_of_variation_range: [0.0, 1.0]

tuning:
  min_stock_level: 0
  max_stock_level: 120
  oracle_mc_samples: 200000
