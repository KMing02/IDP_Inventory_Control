# Maggiar et al. (2025) lost-sales replication configuration.

history_length_H: 32
training_horizon_T: 100
evaluation_horizon: 520
burn_in: 20
training_products: 40000
test_products: 100000
batch_size: 2500
epochs: 1000
optimizer: Adam
learning_rate: 0.001

fcnn:
  history_encoder: causal_cnn
  hidden_layers: 2
  hidden_units: 32
  cnn_channels: 8
  cnn_dilations: [1, 2, 4, 8, 16]
  activation: ELU
  imitation_epochs: 20
  validation_interval: 10
  use_full_history: true
  scale_action_by_history_mean: true
  max_order_factor: 4.0

monokan:
  hidden_layers: 1
  hidden_units: 8
  grid: 3
  grid_range: [-2.0, 4.0]
  monotonic_inventory: nonincreasing
  scale_action_by_history_mean: true
  max_order_factor: 2.0
  TODO: "Continue tuning MonoKAN width/grid after validating the adapted implementation against the official repository."

idp_benchmark:
  seed: 2025
  hidden_layers: 2
  hidden_units: 32
  activation: ELU
  max_order_factor: 4.0
  scale_action_by_history_mean: true
  normalize_reward_loss: true
  monotonicity_samples_per_product: 2
  penalty_weights: [0.1, 1.0, 10.0]
  raw_violation_threshold: 0.01
  acceptance_reward_gap_tolerance_pct: 0.5
  compact:
    training_products: 32
    validation_products: 8
    batch_size: 16
    training_horizon: 20
    imitation_epochs: 2
    reward_epochs: 4
    validation_interval: 1
    evaluation_horizon: 60
    burn_in: 0
    inventory_states: 25
    structure_products: 3
    order_up_to_products: 32
    oracle_mc_samples: 5000
    penalty_weights: [10.0]
  full:
    training_products: 40000
    validation_products: 100
    batch_size: 2500
    training_horizon: 100
    imitation_epochs: 20
    reward_epochs: 1000
    validation_interval: 10
    evaluation_horizon: 520
    burn_in: 20
    inventory_states: 100
    structure_products: 3
    order_up_to_products: 1000
    oracle_mc_samples: 200000
  paper_replication:
    training_products: 40000
    validation_products: 100000
    batch_size: 2500
    training_horizon: 100
    imitation_epochs: 20
    reward_epochs: 1000
    validation_interval: 10
    evaluation_horizon: 520
    burn_in: 20
    inventory_states: 100
    structure_products: 3
    order_up_to_products: 1000
    oracle_mc_samples: 200000
  sample_efficiency:
    history_windows: [16, 32, 64]
    training_products_grid: [100, 1000, 10000, 40000]

demand_distribution: Gamma

product_features:
  - price
  - purchase_cost
  - holding_cost
  - lost_sale_penalty
  - mean_demand
  - coefficient_of_variation

product_generation:
  seed: 2025
  mode: paper_table_1
  price_mean: 100.0
  holding_cost_mean: 5.0
  mean_demand_mean: 100.0
  lost_sale_penalty_max: 10.0
  coefficient_of_variation_range: [0.0, 1.0]

tuning:
  min_stock_level: 0
  max_stock_level: 120
  oracle_mc_samples: 200000

# Development caps keep scripts runnable locally. Full replication should set
# these to null or remove them.
# TODO: Disable caps for final large-scale paper replication runs.
runtime:
  max_training_products: 256
  max_test_products: 512
  baseline_eval_products: 200
  fcnn_train_products: 512
  fcnn_test_products: 200
  fcnn_validation_products: 100
  fcnn_train_epochs: 50
  monokan_sweep_train_products: 128
  monokan_sweep_batch_size: 64
  monokan_sweep_horizon: 40
  monokan_sweep_epochs: 8
