# Small direct base-stock-output validation profile.
# This is designed for laptop-scale methodological validation, not paper replication.

history_length_H: 32
paper_history_feature_mode: summary
paper_include_newsvendor_feature: true
training_horizon_T: 80
evaluation_horizon: 200
burn_in: 20
training_products: 300
test_products: 80
batch_size: 64
epochs: 120
optimizer: Adam
learning_rate: 0.0005
include_terminal_salvage: false

fcnn:
  history_encoder: causal_cnn
  hidden_layers: 2
  hidden_units: 32
  cnn_channels: 8
  cnn_dilations: [1, 2, 4, 8, 16]
  activation: ELU
  imitation_epochs: 0
  validation_interval: 20
  use_full_history: true
  scale_action_by_history_mean: true
  max_order_factor: 4.0
  base_stock_logit_residual_scale: 0.03

monokan:
  hidden_layers: 1
  hidden_units: 4
  grid: 3
  grid_range: [-2.0, 4.0]
  noise_scale: 0.01
  bounded_spline_scale_init: 1.0
  bounded_spline_slope_init: 1.0
  scale_action_by_history_mean: true
  max_order_factor: 4.0
  base_stock_logit_residual_scale: 0.03

idp_benchmark:
  seed: 2025
  hidden_layers: 2
  hidden_units: 32
  activation: ELU
  max_order_factor: 4.0
  scale_action_by_history_mean: true
  normalize_reward_loss: true
  include_terminal_salvage: false
  training_demand_mode: fixed_future
  compact:
    training_products: 300
    validation_products: 80
    batch_size: 64
    training_horizon: 80
    imitation_epochs: 0
    reward_epochs: 120
    validation_interval: 20
    evaluation_horizon: 200
    burn_in: 20

demand_distribution: Gamma

product_features:
  - price
  - purchase_cost
  - holding_cost
  - lost_sale_penalty
  - mean_demand
  - coefficient_of_variation

product_generation:
  seed: 2025
  mode: paper_table_1
  price_mean: 100.0
  holding_cost_mean: 5.0
  mean_demand_mean: 100.0
  lost_sale_penalty_max: 10.0
  coefficient_of_variation_range: [0.0, 1.0]

tuning:
  min_stock_level: 0
  max_stock_level: 120
  oracle_mc_samples: 200000

runtime:
  max_training_products: 300
  max_test_products: 80
  baseline_eval_products: 80
