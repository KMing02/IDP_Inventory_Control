seed: 321
horizon: 30
evaluation_episodes: 20
oracle_tuning_episodes: 100

splits:
  train: 8
  validation: 4
  test: 4

historical_demand_length: 60
environment_types:
  - lost_sales_zero_lead_time
  - lost_sales_lead_time

demand_process_types:
  - poisson
  - negative_binomial

mean_demand_range: [4.0, 14.0]
coefficient_of_variation_range: [0.3, 1.1]
holding_cost_range: [0.5, 3.0]
lost_sales_cost_range: [4.0, 15.0]
unit_order_cost_range: [0.5, 2.0]
fixed_order_cost_range: [0.0, 1.0]
initial_inventory_multiplier_range: [0.5, 1.5]
lead_time_range: [1, 3]
regular_lead_time_range: [2, 3]
expedited_lead_time_range: [0, 1]
expedited_cost_multiplier_range: [1.5, 3.0]

tuning:
  min_stock_level: 0
  max_stock_level: 45
